<nav class="site-nav">
	<!-- Every button on the bar is a ring icon (ring-status.js), drawn into
	     its .tdc-ring by nav.js: the menu and the account. Notifications and
	     reload are in the menu since 29 Oct (UV), so the bar stays clear of
	     the logo at any width. -->
	<button class="nav-menu-toggle" id="nav-menu-toggle" aria-label="Open menu" aria-expanded="false">
		<span class="tdc-ring nav-ring" id="nav-menu-ring"></span>
		<!-- Something unread: the bell is in the menu, so the menu button
		     carries its pip too, or nothing on the bar would say so. -->
		<span class="nav-notify-pip" id="nav-menu-pip" hidden></span>
	</button>

	<a href="/" class="nav-logo">
		<img class="for-dark" src="/resources/branding/icon-primary.svg" alt="The Dive Club">
		<img class="for-light" src="/resources/branding/logo-mark-light.svg" alt="The Dive Club">
	</a>

	<!-- The right-hand group, pushed to the right edge: offline, then the
	     account. The logo is centred on the bar by itself. -->
	<div class="nav-right">

	<!-- Shown by nav.js whenever the device loses its connection. Every page
	     gets it; what each page does about it is its own business. -->
	<span class="nav-offline" id="nav-offline" hidden role="status">
		<span class="nav-offline-pip" aria-hidden="true"></span>Offline
	</span>

	<!-- Signed in, it opens the profile menu (below); signed out, it goes to
	     sign-in. -->
	<button class="nav-profile" id="nav-profile" aria-label="Account" aria-expanded="false" aria-controls="nav-account">
		<!-- The person until nav.js finds a signed-in player with a picture,
		     then the picture. Both are decorative: the button's aria-label
		     is what a screen reader announces. -->
		<span class="tdc-ring nav-ring" id="nav-profile-icon"></span>
		<!-- Signed in with no picture: the display name's initials (UV, 16 Nov). -->
		<span class="nav-initials" id="nav-initials" aria-hidden="true" hidden></span>
		<span class="nav-avatar-wrap"><img class="nav-avatar" id="nav-avatar" alt="" hidden></span>
	</button>

	</div>
</nav>

<!-- Linked to your league record (16 Nov, UV; nav.js, "League records").
     Signing in links a league placeholder with the same email by itself;
     this says so, with a button to each league, above Get the app. Kept on
     this device until ✕. A failed link shows its error here instead. -->
<div class="nav-linked" id="nav-linked" role="status" hidden>
	<span class="nav-linked-text" id="nav-linked-text"></span>
	<span class="nav-linked-go" id="nav-linked-go"></span>
	<button type="button" class="nav-linked-x" id="nav-linked-x" aria-label="Hide this">✕</button>
</div>

<!-- Getting the app (13 Nov; nav.js, "Getting the app"). In the page's flow,
     straight under the bar, so it pushes the page down rather than covering
     it. Phones only, never in the installed app: shown on the home page only
     (UV, 18 Nov), ✕ hiding it for that visit. In the installed app it is the
     one-off welcome instead, on any page. nav.js
     writes the words and the button. -->
<div class="nav-get-app" id="nav-get-app" role="region" aria-label="Get the app" hidden>
	<span class="nav-get-app-text" id="nav-get-app-text"></span>
	<a class="nav-get-app-go" id="nav-get-app-go" href="/install/"></a>
	<button type="button" class="nav-get-app-x" id="nav-get-app-x" aria-label="Hide this">✕</button>
</div>

<div class="nav-menu" id="nav-menu">
	<!-- Notifications. Hidden until nav.js finds a signed-in player: there is
	     nothing to show a stranger, and a bell that opens an empty list is
	     worse than no bell. The pip is the only thing that says "unread" —
	     a count would mean reading the list on every page load. The list
	     unfolds under its row. -->
	<div class="nav-notify-wrap" id="nav-notify-wrap" hidden>
		<button type="button" class="nav-menu-row nav-notify" id="nav-notify" aria-expanded="false" aria-controls="nav-notify-tray">
			<span class="nav-menu-icon">
				<span class="tdc-ring nav-ring" id="nav-notify-ring"></span>
				<span class="nav-notify-pip" id="nav-notify-pip" hidden></span>
			</span>
			<span>Notifications</span>
		</button>

		<div class="nav-notify-tray" id="nav-notify-tray" role="region" aria-label="Notifications">
			<div class="nav-notify-list" id="nav-notify-list"></div>
			<div class="nav-notify-empty" id="nav-notify-empty">Nothing yet.</div>
			<button type="button" class="nav-notify-clear-all" id="nav-notify-clear-all" hidden>Clear all</button>
		</div>
	</div>

	<ul>
		{% for link in navLinks %}
			<li><a href="{{ link.url }}">{{ link.label }}</a></li>
		{% endfor %}
	</ul>

	<!-- Shown by nav.js on a phone in a browser (13 Nov): always there, for
	     whoever closed the strip. Gone in the installed app. -->
	<a class="nav-menu-row nav-get-app-row" id="nav-get-app-row" href="/install/" hidden>
		<span class="nav-menu-icon"><span class="tdc-ring nav-ring" id="nav-get-app-ring"></span></span>
		<span>Get the app</span>
	</a>

	<!-- Shown by nav.js only when the app is running installed, where there is
	     no browser chrome and therefore no way to reload. -->
	<button type="button" class="nav-menu-row nav-reload" id="nav-reload" hidden>
		<span class="nav-menu-icon"><span class="tdc-ring nav-ring" id="nav-reload-ring"></span></span>
		<span>Reload</span>
	</button>
</div>

<!-- The profile menu (UV, 31 Oct): slides in from the right, the whole screen
     under the bar on a phone. Outside the bar, as the menu is, so its blur
     reaches the page. Three parts: the player banner (a tap anywhere on it
     opens the profile), the middle, set into the screen, and the toggles on a
     flat bar. -->
<aside class="nav-account" id="nav-account" aria-label="Your profile menu">
	<!-- Two links side by side (UV, 17 Nov): the picture and names open the
	     account's profile, as the whole banner did; the player icon at the
	     right opens your player profile (/players/?p=, set by nav.js). The icon
	     is UV's icon_player.svg cleaned up: each part one shape, back to front,
	     an even gap cut round it by the mask. Green with a glow. -->
	<div class="nav-account-banner">
		<a href="/accounts/profile/" class="nav-account-banner-main">
			<span class="nav-account-pic" id="nav-account-pic" aria-hidden="true"></span>
			<span class="nav-account-names">
				<span class="nav-account-display" id="nav-account-display"></span>
				<span class="nav-account-full" id="nav-account-full" hidden></span>
			</span>
		</a>
		<a class="nav-account-player" id="nav-account-player" aria-label="Your player profile" hidden>

3" r="12" fill="#000" stroke="#000" stroke-width="4.4"/><circle cx="77.6" cy="26.3" r="12" fill="#fff"/></mask><rect width="135.47" height="135.47" fill="currentColor" mask="url(#nav-player-cut)"/></svg>
		</a>
	</div>

	<!-- The middle: what you're in, one tap from each (nav.js, tdc_my_active). -->
	<div class="nav-account-middle">
		<span class="nav-account-dots" id="nav-account-dots" aria-hidden="true"></span>
		<div id="nav-account-list"></div>
	</div>

	<!-- Icons only (UV): each side of a toggle has its own icon, and the
	     aria-label says what it is. Made into switches by tdc-controls.js. -->
	<div class="nav-account-foot">
		<input type="checkbox" id="nav-pref-theme" data-icon-off="moon" data-icon-on="sun" aria-label="Light theme">
		<input type="checkbox" id="nav-pref-motion" data-icon-off="motion" data-icon-on="still" aria-label="Less motion">
	</div>
</aside>
