---
layout: layout.html
title: Sign In
description: Log in to The Dive Club.
extraScripts:
  - /scripts/auth.js
---
<style>
	.auth-box { width: 100%; max-width: 360px; padding: 2rem; margin: 0 auto; }
	.auth-box h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
	.auth-box input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-primary); box-sizing: border-box; }
	.auth-box button { width: 100%; padding: 0.75rem; margin-bottom: 0.75rem; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
	.btn-primary { background: var(--color-primary); color: #fff; }
	.btn-google { background: #fff; color: #222; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
	.toggle-link { text-align: center; margin-top: 1rem; font-size: 0.9rem; color: var(--color-primary); cursor: pointer; }
	.status { text-align: center; margin-top: 1rem; font-size: 0.9rem; min-height: 1.2em; }
	.status.error { color: var(--color-error); }
	.status.success { color: var(--color-success); }
</style>

<div class="auth-box">
	<h1 id="form-title">Log In</h1>

	<button class="btn-google" id="google-signin">Continue with Google</button>

	<div style="text-align:center; margin: 1rem 0; color: var(--text-muted);">— or —</div>

	<form id="auth-form">
		<input type="email" id="email" placeholder="Email" required>
		<input type="password" id="password" placeholder="Password" required minlength="6">
		<button type="submit" class="btn-primary" id="submit-btn">Log In</button>
	</form>

	<div class="toggle-link" id="toggle-mode">Don't have an account? Sign up</div>
	<div class="status" id="status-msg"></div>
</div>
