---
layout: layout.html
title: Sign In
description: Log in to The Dive Club.
extraScripts:
  - /scripts/auth.js
---
<div class="tdc-card">
	<h1 id="form-title">Log In</h1>

	<button type="button" class="btn-google" id="google-signin">Continue with Google</button>

	<div class="link-row" style="margin: 0.5rem 0 1rem; color: var(--text-muted);">— or —</div>

	<form id="auth-form" novalidate>
		<div class="field" id="display-name-field" hidden>
			<label for="display-name">Display name</label>
			<input type="text" id="display-name" autocomplete="nickname" maxlength="100">
			<div class="hint">How other players will see you. You can change it later.</div>
		</div>

		<div class="field">
			<label for="email">Email</label>
			<input type="email" id="email" autocomplete="email" required>
		</div>

		<div class="field">
			<label for="password">Password</label>
			<input type="password" id="password" autocomplete="current-password" required minlength="8">
			<div class="hint" id="password-hint" hidden>At least 8 characters, with letters and numbers.</div>
		</div>

		<button type="submit" class="btn-primary" id="submit-btn">Log In</button>
	</form>

	<div class="link-row">
		<button type="button" class="link" id="toggle-mode">Don't have an account? Sign up</button>
	</div>
	<div class="link-row" id="forgot-row">
		<a href="/accounts/reset/">Forgot password?</a>
	</div>

	<div class="status" id="status-msg"></div>
</div>
