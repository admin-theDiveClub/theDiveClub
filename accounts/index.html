<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign In — The Dive Club</title>
	<link rel="manifest" href="/site.webmanifest">
	<meta name="theme-color" content="#2b9fa6">
	<link rel="icon" href="/favicon.ico" sizes="any">
	<link rel="stylesheet" href="/stylesheets/variables.css">
	<style>
		body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: sans-serif; background: #181818; color: #fff; }
		.auth-box { width: 100%; max-width: 360px; padding: 2rem; }
		.auth-box h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
		.auth-box input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
		.auth-box button { width: 100%; padding: 0.75rem; margin-bottom: 0.75rem; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
		.btn-primary { background: #2b9fa6; color: #fff; }
		.btn-google { background: #fff; color: #222; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
		.toggle-link { text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #2b9fa6; cursor: pointer; }
		.status { text-align: center; margin-top: 1rem; font-size: 0.9rem; min-height: 1.2em; }
		.status.error { color: #ff6b6b; }
		.status.success { color: #6bff9e; }
	</style>
</head>
<body>
	<div class="auth-box">
		<h1 id="form-title">Log In</h1>

		<button class="btn-google" id="google-signin">Continue with Google</button>

		<div style="text-align:center; margin: 1rem 0; color:#666;">— or —</div>

		<form id="auth-form">
			<input type="email" id="email" placeholder="Email" required>
			<input type="password" id="password" placeholder="Password" required minlength="6">
			<button type="submit" class="btn-primary" id="submit-btn">Log In</button>
		</form>

		<div class="toggle-link" id="toggle-mode">Don't have an account? Sign up</div>
		<div class="status" id="status-msg"></div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
	<script src="/scripts/supabaseClient.js"></script>
	<script src="/scripts/auth.js"></script>
</body>
</html>
