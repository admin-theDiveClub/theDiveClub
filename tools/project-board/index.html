<title>Dive Club Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
	--bg:#F2F5F4; --surface:#FFFFFF; --ink:#15201E; --muted:#5B6966; --line:#D9E1DE;
	--accent:#0C8579; --accent-soft:#DDF1EE; --amber:#9A6212; --amber-soft:#F8EBD3;
	--blue:#2F5FA8; --blue-soft:#E1E9F6; --todo-soft:#E9EEEC; --danger:#B8392A; --flash:#FFF3C4;
}
@media (prefers-color-scheme: dark){
	:root:not([data-theme="light"]){
		color-scheme:dark;
		--bg:#111516; --surface:#191F21; --ink:#E4ECEA; --muted:#8C9A97; --line:#283033;
		--accent:#38C9B9; --accent-soft:#16332F; --amber:#E7AE4C; --amber-soft:#35291A;
		--blue:#86A9E6; --blue-soft:#1D2940; --todo-soft:#222A2C; --danger:#F0806F; --flash:#3A3418;
	}
}
:root[data-theme="dark"]{
	color-scheme:dark;
	--bg:#111516; --surface:#191F21; --ink:#E4ECEA; --muted:#8C9A97; --line:#283033;
	--accent:#38C9B9; --accent-soft:#16332F; --amber:#E7AE4C; --amber-soft:#35291A;
	--blue:#86A9E6; --blue-soft:#1D2940; --todo-soft:#222A2C; --danger:#F0806F; --flash:#3A3418;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Barlow",system-ui,sans-serif;padding-inline:16px;padding-block:20px 56px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,.tab,.pill,.chip{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font-size:30px;font-weight:700;line-height:1}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.count{display:flex;align-items:baseline;gap:5px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;color:var(--muted)}
.count b{font:600 18px/1 "Barlow Condensed",sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px}
.tab{appearance:none;border:0;background:none;color:var(--muted);font-size:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:8px 12px 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.filters label{display:grid;gap:2px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.filters input[type=search],.filters select{font:14px "Barlow",sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.filters .search{flex:1 1 180px}
.filters .search input{width:100%}
.check{display:flex!important;grid-auto-flow:column;align-items:center;gap:6px;text-transform:none!important;letter-spacing:0!important;font-size:13px!important;padding-bottom:7px;cursor:pointer}
.linkbtn{appearance:none;border:0;background:none;color:var(--accent);font:600 13px "Barlow",sans-serif;cursor:pointer;padding:4px 2px}
.status{font-size:13px;color:var(--muted);min-height:18px}
.status.err{color:var(--danger)}
.group{display:flex;flex-direction:column;gap:6px}
.group h2{margin:0;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-height:28px}
.group h2 .gname{flex:0 1 auto}
.group h2 .spacer{flex:1}
.group h2 .gcount{font-weight:500;letter-spacing:0;text-transform:none;font-family:"Barlow",sans-serif;font-size:12px}
.iconbtn{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;font:13px "Barlow",sans-serif;padding:2px 6px;border-radius:4px}
.iconbtn:hover{color:var(--accent);background:var(--accent-soft)}
.rename{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rename input{font:600 14px "Barlow",sans-serif;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.node{border-top:1px solid var(--line)}
.list>.node:first-child{border-top:0}
.row{display:grid;grid-template-columns:22px auto 1fr;gap:4px 10px;padding:9px 12px 9px calc(12px + var(--depth,0) * 22px);align-items:start;transition:background .6s}
.row.flash{background:var(--flash)}
.chev{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;width:22px;height:24px;padding:0;font-size:12px;line-height:24px;transition:transform .15s}
.chev[aria-expanded="true"]{transform:rotate(90deg)}
.chev.none{visibility:hidden}
.pill{appearance:none;border:0;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 22px 3px 10px;cursor:pointer;min-width:98px;margin-top:1px;
	background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(-45deg,transparent 50%,currentColor 50%);background-size:4px 4px,4px 4px;background-position:right 12px center,right 8px center;background-repeat:no-repeat}
.pill[data-s="next"]{background-color:var(--accent-soft);color:var(--accent)}
.pill[data-s="progress"]{background-color:var(--blue-soft);color:var(--blue)}
.pill[data-s="todo"]{background-color:var(--todo-soft);color:var(--muted)}
.pill[data-s="waiting"]{background-color:var(--amber-soft);color:var(--amber)}
.pill[data-s="done"]{background-color:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.main{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;min-width:0}
.title{appearance:none;border:0;background:none;padding:0;color:var(--ink);font:500 15px/1.4 "Barlow",sans-serif;text-align:left;cursor:pointer}
.title:hover{color:var(--accent)}
.done-row .title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.crumb{color:var(--muted);font-size:12px;width:100%}
.chip{font-size:12px;font-weight:600;letter-spacing:.04em;padding:1px 7px;border-radius:4px;background:var(--todo-soft);color:var(--muted);white-space:nowrap}
.chip.person{background:var(--blue-soft);color:var(--blue)}
.meta{grid-column:3;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.meta .note{white-space:pre-wrap}
.rel{display:flex;flex-wrap:wrap;gap:4px;align-items:baseline}
.rel .k{font-weight:600}
.rel.wait .k{color:var(--amber)}
.rel.hold .k{color:var(--accent)}
.jump{appearance:none;border:0;background:none;padding:0;color:inherit;font:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px;cursor:pointer;text-align:left}
.jump:hover{color:var(--accent)}
.jump.cleared{text-decoration:line-through}
.kids{border-top:1px solid var(--line);background:linear-gradient(90deg,transparent calc(22px + var(--depth,0)*22px),var(--line) calc(22px + var(--depth,0)*22px),var(--line) calc(23px + var(--depth,0)*22px),transparent calc(23px + var(--depth,0)*22px))}
.kids>.node:first-child{border-top:0}
.addkid{padding:5px 12px 7px calc(44px + var(--depth,0) * 22px)}
.form{grid-column:1/-1;display:grid;gap:10px;padding:8px 0 4px}
.form label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.form input,.form textarea,.form select{width:100%;font:15px "Barlow",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.form textarea{min-height:60px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.pair{display:flex;gap:6px}
.pair>*{flex:1;min-width:0}
fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0;display:grid;gap:6px}
legend{font-size:12px;color:var(--muted);padding:0 4px}
.linkrow{display:grid;grid-template-columns:130px 1fr auto;gap:6px}
@media (max-width:560px){.linkrow{grid-template-columns:1fr auto}.linkrow .ltarget{grid-column:1/-1;grid-row:2}}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 12px;font:600 14px "Barlow",sans-serif;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--danger);margin-right:auto}
.empty{padding:12px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.chev,.row{transition:none}}
</style>

<div class="wrap">
	<header>
		<div>
			<h1>Dive Club Board</h1>
			<div class="sub">C5, The Gantry · the running list for the business and theDiveClub</div>
		</div>
		<div class="counts" id="counts"></div>
	</header>
	<div class="bar">
		<div class="tabs" role="tablist">
			<button class="tab" role="tab" data-track="business">Business</button>
			<button class="tab" role="tab" data-track="website">Website</button>
			<button class="tab" role="tab" data-track="all">All</button>
		</div>
	</div>
	<div class="filters" id="filters">
		<label class="search">Search<input type="search" id="fq" placeholder="Find a task"></label>
		<label>Status<select id="fStatus"></select></label>
		<label>Person<select id="fPerson"></select></label>
		<label>Group<select id="fGroup"></select></label>
		<label>Group by<select id="groupBy">
			<option value="group">Group</option><option value="status">Status</option><option value="person">Person</option><option value="none">Nothing</option>
		</select></label>
		<label class="check"><input type="checkbox" id="showDone"> Show done</label>
		<button class="linkbtn" id="clearFilters" hidden>Clear filters</button>
	</div>
	<div class="status" id="status">Loading…</div>
	<div id="board" class="wrap" style="gap:22px"></div>
	<button class="btn" id="newGroup" style="align-self:flex-start" hidden>+ New group</button>
</div>

<script>
const STATUSES=[["next","Next"],["progress","In progress"],["todo","To do"],["waiting","Waiting"],["done","Done"]];
const SLABEL=Object.fromEntries(STATUSES); const SRANK=Object.fromEntries(STATUSES.map(([s],i)=>[s,i]));
const LINKS=[["waiting_on","Waiting on"],["blocks","Blocks"],["related","Related to"]];
const TRACKS={business:"Business",website:"Website"};
let items={}, meta={groups:{business:[],website:[]},people:[]}, db=null, canWrite=true;
let ui={track:"business",q:"",fStatus:"",fPerson:"",fGroup:"",groupBy:"group",showDone:false,expanded:[]};
let editing=null, renaming=null, pendingRender=false;
try{Object.assign(ui,JSON.parse(localStorage.getItem("tdc-board-ui")||"{}"));}catch(e){}
let expanded=new Set(ui.expanded||[]);
const saveUI=()=>{ui.expanded=[...expanded];try{localStorage.setItem("tdc-board-ui",JSON.stringify(ui))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function setStatus(m,err){const el=$("#status");el.textContent=m||"";el.classList.toggle("err",!!err);}

/* ---------- model helpers ---------- */
const all=()=>Object.values(items);
const kids=id=>all().filter(i=>(i.parentId||null)===id).sort((a,b)=>(a.order??0)-(b.order??0));
function rootOf(it){let c=it,guard=0;while(c&&c.parentId&&items[c.parentId]&&guard++<50)c=items[c.parentId];return c;}
const groupOf=it=>rootOf(it)?.group||"Ungrouped";
const trackOf=it=>rootOf(it)?.track||it.track;
function ancestors(it){const a=[];let c=it,g=0;while(c.parentId&&items[c.parentId]&&g++<50){c=items[c.parentId];a.unshift(c);}return a;}
function descendants(id){const out=[];(function walk(p){kids(p).forEach(k=>{out.push(k);walk(k.id);});})(id);return out;}
const tracksShown=()=>ui.track==="all"?["business","website"]:[ui.track];
function groupsFor(t){const g=[...(meta.groups?.[t]||[])];all().filter(i=>!i.parentId&&i.track===t&&i.group&&!g.includes(i.group)).forEach(i=>g.includes(i.group)||g.push(i.group));return g;}
function peopleList(){const p=[...(meta.people||[])];all().forEach(i=>i.person&&!p.includes(i.person)&&p.push(i.person));return p.sort((a,b)=>a.localeCompare(b));}
const filtering=()=>!!(ui.q||ui.fStatus||ui.fPerson||ui.fGroup);
const treeMode=()=>ui.groupBy==="group"&&!filtering();
function hasOpenDesc(id){return descendants(id).some(d=>d.status!=="done");}
function visibleInTree(it){return ui.showDone||it.status!=="done"||hasOpenDesc(it.id)||editing===it.id;}
function incoming(id){const out=[];all().forEach(o=>(o.links||[]).forEach(l=>{if(l.id===id)out.push({type:l.type,from:o});}));return out;}

/* ---------- render ---------- */
function renderControls(){
	document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.track===ui.track));
	if(document.activeElement!==$("#fq")) $("#fq").value=ui.q;
	$("#fStatus").innerHTML=`<option value="">Any status</option>`+STATUSES.map(([v,l])=>`<option value="${v}">${l}</option>`).join("");
	$("#fStatus").value=ui.fStatus;
	$("#fPerson").innerHTML=`<option value="">Anyone</option><option value="__none">No one assigned</option>`+peopleList().map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join("");
	$("#fPerson").value=ui.fPerson;
	const gs=[];tracksShown().forEach(t=>groupsFor(t).forEach(g=>gs.includes(g)||gs.push(g)));
	$("#fGroup").innerHTML=`<option value="">Any group</option>`+gs.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join("");
	$("#fGroup").value=gs.includes(ui.fGroup)?ui.fGroup:"";
	$("#groupBy").value=ui.groupBy; $("#showDone").checked=ui.showDone;
	$("#clearFilters").hidden=!filtering();
	const mine=all().filter(i=>tracksShown().includes(trackOf(i)));
	$("#counts").innerHTML=STATUSES.map(([s,l])=>`<span class="count"><b>${mine.filter(i=>i.status===s).length}</b>${l}</span>`).join("");
	$("#newGroup").hidden=!canWrite||!treeMode()||ui.track==="all"||editing==="newgroup";
}

function render(){
	pendingRender=false;
	renderControls();
	const out=[];
	if(treeMode()){
		for(const t of tracksShown()){
			for(const g of groupsFor(t)){
				const roots=kids(null).filter(i=>i.track===t&&(i.group||"Ungrouped")===g);
				const vis=roots.filter(visibleInTree);
				const label=(ui.track==="all"?TRACKS[t]+" · ":"")+g;
				out.push(`<section class="group">${groupHead("group",g,label,roots.length,t,true)}<div class="list">`+
					vis.map(r=>nodeHTML(r,0,true)).join("")+
					(editing===`new:${t}::${g}`?`<div class="node"><div class="row">${formHTML(null,{track:t,group:g,parentId:null})}</div></div>`:"")+
					(!vis.length&&editing!==`new:${t}::${g}`?`<div class="empty">${roots.length?"All done here.":"No tasks in this group yet."}${!roots.length&&canWrite?` <button class="linkbtn" data-delgroup="${esc(g)}" data-t="${t}">Remove group</button>`:""}</div>`:"")+
					`</div></section>`);
			}
		}
		if(editing==="newgroup"){out.push(`<section class="group"><h2><form class="rename" data-newgroup><input id="newGroupName" placeholder="Group name" required><button class="btn primary">Add group</button><button type="button" class="btn" data-cancel>Cancel</button></form></h2></section>`);}
	}else{
		const q=ui.q.toLowerCase();
		let list=all().filter(i=>tracksShown().includes(trackOf(i))).filter(i=>{
			if(ui.fStatus&&i.status!==ui.fStatus) return false;
			if(!ui.fStatus&&!ui.showDone&&i.status==="done") return false;
			if(ui.fPerson==="__none"&&i.person) return false;
			if(ui.fPerson&&ui.fPerson!=="__none"&&i.person!==ui.fPerson) return false;
			if(ui.fGroup&&groupOf(i)!==ui.fGroup) return false;
			if(q&&!((i.title||"")+" "+(i.note||"")).toLowerCase().includes(q)) return false;
			return true;
		});
		const keyOf={group:i=>(ui.track==="all"?TRACKS[trackOf(i)]+" · ":"")+groupOf(i),status:i=>i.status,person:i=>i.person||"",none:()=>"all"}[ui.groupBy];
		const buckets=new Map();
		let keys;
		if(ui.groupBy==="status") keys=STATUSES.map(s=>s[0]);
		else if(ui.groupBy==="person") keys=[...peopleList(),""];
		else keys=[];
		keys.forEach(k=>buckets.set(k,[]));
		list.sort((a,b)=>SRANK[a.status]-SRANK[b.status]||(a.order??0)-(b.order??0)).forEach(i=>{const k=keyOf(i);if(!buckets.has(k))buckets.set(k,[]);buckets.get(k).push(i);});
		for(const [k,arr] of buckets){
			if(!arr.length) continue;
			const label=ui.groupBy==="status"?SLABEL[k]:ui.groupBy==="person"?(k||"No one assigned"):ui.groupBy==="none"?"Matching tasks":k;
			const head=ui.groupBy==="person"&&k?groupHead("person",k,label,arr.length,null,true):groupHead(null,k,label,arr.length,null,false);
			out.push(`<section class="group">${head}<div class="list">${arr.map(i=>nodeHTML(i,0,true,true)).join("")}</div></section>`);
		}
		if(!out.length) out.push(`<div class="empty">No tasks match these filters.</div>`);
	}
	$("#board").innerHTML=out.join("");
}

function groupHead(kind,name,label,n,t,editable){
	const key=kind+":"+(t||"")+":"+name;
	if(renaming===key) return `<h2><form class="rename" data-rename="${kind}" data-old="${esc(name)}" data-t="${t||""}"><input id="renameInput" value="${esc(name)}" required><button class="btn primary">Save</button><button type="button" class="btn" data-cancel>Cancel</button></form></h2>`;
	return `<h2><span class="gname">${esc(label)}</span><span class="gcount">${n}</span>${editable&&canWrite&&kind?`<button class="iconbtn" data-startrename="${esc(key)}" title="Rename">Rename</button>`:""}<span class="spacer"></span>${kind==="group"&&canWrite?`<button class="linkbtn" data-add="${t}::${esc(name)}">+ Add task</button>`:""}</h2>`;
}

function pill(i){return `<select class="pill" data-s="${i.status}" data-id="${i.id}" aria-label="Status" ${canWrite?"":"disabled"}>`+STATUSES.map(([v,l])=>`<option value="${v}" ${v===i.status?"selected":""}>${l}</option>`).join("")+`</select>`;}

function relHTML(i){
	const lines=[];
	(i.links||[]).forEach(l=>{const t=items[l.id];if(!t)return;
		const lbl={waiting_on:"Waiting on",blocks:"Blocks",related:"Related to"}[l.type]||"Linked";
		lines.push(`<span class="rel ${l.type==="waiting_on"&&t.status!=="done"?"wait":""}"><span class="k">${lbl}:</span><button class="jump ${t.status==="done"?"cleared":""}" data-jump="${t.id}">${esc(t.title)}</button>${t.status==="done"?" ✓":""}</span>`);});
	incoming(i.id).forEach(({type,from})=>{
		const lbl={waiting_on:"Holding up",blocks:"Blocked by",related:"Related to"}[type];
		if(!lbl)return;
		lines.push(`<span class="rel ${type==="waiting_on"&&i.status!=="done"&&from.status!=="done"?"hold":""}"><span class="k">${lbl}:</span><button class="jump ${from.status==="done"?"cleared":""}" data-jump="${from.id}">${esc(from.title)}</button></span>`);});
	return lines.join("");
}

function nodeHTML(i,depth,tree,showPath){
	const ks=kids(i.id); const open=expanded.has(i.id); const isEdit=editing===i.id;
	const doneKids=descendants(i.id).filter(d=>d.status==="done").length, allKids=descendants(i.id).length;
	const crumbs=showPath?ancestors(i).map(a=>a.title):[];
	const rel=relHTML(i);
	let h=`<div class="node" data-node="${i.id}"><div class="row ${i.status==="done"?"done-row":""}" id="row-${i.id}" style="--depth:${depth}">
		${tree&&ks.length?`<button class="chev" data-toggle="${i.id}" aria-expanded="${open}" aria-label="${open?"Collapse":"Expand"} sub-tasks">▶</button>`:`<span class="chev none"></span>`}
		${pill(i)}
		<div class="main">
			${crumbs.length?`<span class="crumb">${crumbs.map(esc).join(" › ")} ›</span>`:""}
			<button class="title" data-edit="${i.id}" aria-expanded="${isEdit}">${esc(i.title)}</button>
			${allKids?`<span class="chip" title="Sub-tasks done">${doneKids}/${allKids}</span>`:""}
			${i.person?`<span class="chip person">${esc(i.person)}</span>`:""}
		</div>
		${i.note||rel?`<div class="meta">${rel}${i.note?`<span class="note">${esc(i.note)}</span>`:""}</div>`:""}
		${isEdit?formHTML(i):""}
	</div>`;
	if(tree&&ks.length&&open){
		const vk=ks.filter(visibleInTree);
		h+=`<div class="kids" style="--depth:${depth}">${vk.map(k=>nodeHTML(k,depth+1,true)).join("")}`+
			(editing===`kid:${i.id}`?`<div class="node"><div class="row" style="--depth:${depth+1}">${formHTML(null,{track:i.track||trackOf(i),parentId:i.id})}</div></div>`:
			 canWrite?`<div class="addkid" style="--depth:${depth}"><button class="linkbtn" data-addkid="${i.id}">+ Add sub-task</button></div>`:"")+`</div>`;
	}
	return h+`</div>`;
}

function optList(list,sel,extra){return list.map(v=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(v)}</option>`).join("")+(extra||"");}
function taskOptions(excl,sel){
	return ["business","website"].map(t=>{
		const rows=[];(function walk(p,d){kids(p).filter(k=>p!==null||k.track===t).forEach(k=>{if(!excl.has(k.id))rows.push(`<option value="${k.id}" ${k.id===sel?"selected":""}>${"— ".repeat(d)}${esc(k.title)}${k.status==="done"?" (done)":""}</option>`);walk(k.id,d+1);});})(null,0);
		return rows.length?`<optgroup label="${TRACKS[t]}">${rows.join("")}</optgroup>`:"";
	}).join("");
}
function linkRow(l,excl){
	return `<div class="linkrow"><select class="ltype" aria-label="Link type">${LINKS.map(([v,n])=>`<option value="${v}" ${l&&l.type===v?"selected":""}>${n}</option>`).join("")}</select>
	<select class="ltarget" aria-label="Task">${l?"":`<option value="">Choose a task…</option>`}${taskOptions(excl,l&&l.id)}</select>
	<button type="button" class="iconbtn" data-rmlink aria-label="Remove link">✕</button></div>`;
}
function formHTML(i,preset){
	const isNew=!i; const it=i||{title:"",note:"",person:"",links:[],...preset};
	const id=isNew?"new":i.id; const t=it.track||trackOf(it);
	const excl=new Set(isNew?[]:[i.id,...descendants(i.id).map(d=>d.id)]);
	const parentOpts=`<option value="">None (top-level task)</option>`+taskOptions(excl,it.parentId||"");
	return `<form class="form" data-form="${id}" data-track="${t}">
		<label>Task<input id="f-title-${id}" name="title" value="${esc(it.title)}" required></label>
		<label>Notes<textarea id="f-note-${id}" name="note">${esc(it.note)}</textarea></label>
		<div class="grid2">
			<label>Sub-task of<select id="f-parent-${id}" name="parentId">${parentOpts}</select></label>
			<label class="groupfield" ${it.parentId?"hidden":""}>Group<div class="pair"><select id="f-group-${id}" name="group">${optList(groupsFor(t),it.group||groupsFor(t)[0])}<option value="__new">+ New group…</option></select><input id="f-newgroup-${id}" name="newGroup" placeholder="New group name" hidden></div></label>
			<label>Person<div class="pair"><select id="f-person-${id}" name="person"><option value="">No one</option>${optList(peopleList(),it.person||"")}<option value="__new">+ New person…</option></select><input id="f-newperson-${id}" name="newPerson" placeholder="Name" hidden></div></label>
		</div>
		<fieldset><legend>Links to other tasks</legend><div class="links">${(it.links||[]).filter(l=>items[l.id]).map(l=>linkRow(l,excl)).join("")}</div>
			<div><button type="button" class="linkbtn" data-addlink>+ Add link</button></div></fieldset>
		<div class="actions">
			${isNew?"":`<button type="button" class="btn danger" data-del="${id}">Delete</button>`}
			<button type="button" class="btn" data-cancel>Cancel</button>
			<button type="submit" class="btn primary">${isNew?"Add task":"Save"}</button>
		</div></form>`;
}

/* ---------- writes ---------- */
async function write(fn,ok){
	if(!db){setStatus("Changes can't be saved in this view.",true);return false;}
	try{await fn();setStatus(ok||"");return true;}
	catch(e){
		if(e&&e.code==="invalid_argument"){canWrite=false;setStatus("You can view this board but not change it.",true);render();}
		else setStatus("Couldn't save that change. Try again in a moment.",true);
		return false;
	}
}
const saveMeta=()=>db.doc("meta/lists").set(JSON.parse(JSON.stringify(meta)));
function addToMeta(kind,name,t){
	if(kind==="group"){meta.groups=meta.groups||{};meta.groups[t]=meta.groups[t]||[];if(!meta.groups[t].includes(name))meta.groups[t].push(name);}
	else{meta.people=meta.people||[];if(!meta.people.includes(name))meta.people.push(name);}
}
function nextOrder(parentId,t){const s=all().filter(i=>(i.parentId||null)===parentId&&(parentId||i.track===t));return s.length?Math.max(...s.map(i=>i.order??0))+1:1;}

/* ---------- events ---------- */
function focusSoon(sel){setTimeout(()=>{const el=document.querySelector(sel);el&&el.focus();},0);}
function jumpTo(id){
	const it=items[id]; if(!it) return;
	ui.q="";ui.fStatus="";ui.fPerson="";ui.fGroup="";ui.groupBy="group";
	const t=trackOf(it); if(ui.track!=="all") ui.track=t;
	if(it.status==="done") ui.showDone=true;
	ancestors(it).forEach(a=>expanded.add(a.id));
	editing=null;saveUI();render();
	const row=document.getElementById("row-"+id);
	if(row){row.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});row.classList.add("flash");setTimeout(()=>row.classList.remove("flash"),1400);}
}

document.addEventListener("click",async e=>{
	const t=e.target.closest("button,[data-track]"); if(!t) return;
	const d=t.dataset;
	if(d.track){ui.track=d.track;editing=null;renaming=null;saveUI();render();return;}
	if(d.toggle){expanded.has(d.toggle)?expanded.delete(d.toggle):expanded.add(d.toggle);saveUI();render();return;}
	if(d.jump){jumpTo(d.jump);return;}
	if(d.edit){if(!canWrite)return;editing=editing===d.edit?null:d.edit;renaming=null;render();if(editing)focusSoon("#f-title-"+editing);return;}
	if(d.add!==undefined){editing="new:"+d.add;renaming=null;render();focusSoon("#f-title-new");return;}
	if(d.addkid){editing="kid:"+d.addkid;expanded.add(d.addkid);render();focusSoon("#f-title-new");return;}
	if(t.id==="newGroup"){editing="newgroup";render();focusSoon("#newGroupName");return;}
	if(t.id==="clearFilters"){ui.q="";ui.fStatus="";ui.fPerson="";ui.fGroup="";saveUI();render();return;}
	if(d.cancel!==undefined){editing=null;renaming=null;if(pendingRender)render();else render();return;}
	if(d.startrename){renaming=d.startrename;editing=null;render();focusSoon("#renameInput");return;}
	if(d.addlink!==undefined){
		const f=t.closest("form");const id=f.dataset.form;
		const excl=new Set(id==="new"?[]:[id,...descendants(id).map(x=>x.id)]);
		f.querySelector(".links").insertAdjacentHTML("beforeend",linkRow(null,excl));return;
	}
	if(d.rmlink!==undefined){t.closest(".linkrow").remove();return;}
	if(d.delgroup){const tr=d.t;meta.groups[tr]=(meta.groups[tr]||[]).filter(g=>g!==d.delgroup);await write(saveMeta,"Group removed.");render();return;}
	if(d.del){
		const id=d.del;const n=descendants(id).length;
		if(d.confirm!=="1"){d.confirm="1";t.textContent=n?`Delete with ${n} sub-task${n>1?"s":""}?`:"Tap again to delete";return;}
		editing=null;
		const ids=[...descendants(id).map(x=>x.id),id];
		await write(async()=>{for(const x of ids) await db.doc("items/"+x).delete();},"Deleted.");
		render();
	}
});

document.addEventListener("change",async e=>{
	const el=e.target;
	if(el.id==="fStatus"||el.id==="fPerson"||el.id==="fGroup"||el.id==="groupBy"){ui[el.id]=el.value;editing=null;saveUI();render();return;}
	if(el.id==="showDone"){ui.showDone=el.checked;saveUI();render();return;}
	if(el.matches("select.pill")){
		el.dataset.s=el.value;
		await write(()=>db.doc("items/"+el.dataset.id).update({status:el.value,updated:new Date().toISOString()}));
		return;
	}
	if(el.name==="group"||el.name==="person"){
		const inp=el.parentElement.querySelector("input");inp.hidden=el.value!=="__new";inp.required=el.value==="__new";if(!inp.hidden)inp.focus();return;
	}
	if(el.name==="parentId"){el.closest("form").querySelector(".groupfield").hidden=!!el.value;return;}
});
let qTimer;
document.addEventListener("input",e=>{if(e.target.id==="fq"){clearTimeout(qTimer);qTimer=setTimeout(()=>{ui.q=e.target.value.trim();saveUI();render();},250);}});

document.addEventListener("submit",async e=>{
	e.preventDefault();
	const f=e.target;
	if(f.dataset.newgroup!==undefined){
		const name=f.querySelector("input").value.trim(); if(!name) return;
		addToMeta("group",name,ui.track); editing=null;
		await write(saveMeta,"Group added."); render(); return;
	}
	if(f.dataset.rename!==undefined){
		const kind=f.dataset.rename, old=f.dataset.old, tr=f.dataset.t, name=f.querySelector("input").value.trim();
		if(!name||name===old){renaming=null;render();return;}
		renaming=null;
		await write(async()=>{
			if(kind==="group"){
				const list=meta.groups[tr]||[];const ix=list.indexOf(old);
				if(list.includes(name)) meta.groups[tr]=list.filter(g=>g!==old); else if(ix>=0) list[ix]=name; else list.push(name);
				await saveMeta();
				for(const it of all().filter(i=>!i.parentId&&i.track===tr&&i.group===old)) await db.doc("items/"+it.id).update({group:name});
				if(ui.fGroup===old) ui.fGroup=name;
			}else{
				const list=meta.people||[];const ix=list.indexOf(old);
				if(list.includes(name)) meta.people=list.filter(p=>p!==old); else if(ix>=0) list[ix]=name; else list.push(name);
				await saveMeta();
				for(const it of all().filter(i=>i.person===old)) await db.doc("items/"+it.id).update({person:name});
				if(ui.fPerson===old) ui.fPerson=name;
			}
		},"Renamed.");
		saveUI();render();return;
	}
	const id=f.dataset.form, tr=f.dataset.track;
	const val=n=>(f.elements[n]?.value||"").trim();
	const title=val("title"); if(!title) return;
	const parentId=val("parentId")||null;
	let group=val("group"), person=val("person"), metaChanged=false;
	if(group==="__new"){group=val("newGroup");if(!group)return;addToMeta("group",group,tr);metaChanged=true;}
	if(person==="__new"){person=val("newPerson");if(!person)return;addToMeta("person",person);metaChanged=true;}
	const links=[...f.querySelectorAll(".linkrow")].map(r=>({type:r.querySelector(".ltype").value,id:r.querySelector(".ltarget").value})).filter(l=>l.id);
	const body={title,note:val("note"),parentId,person,links,updated:new Date().toISOString()};
	if(!parentId) body.group=group||groupsFor(tr)[0]||"General";
	const ok=await write(async()=>{
		if(metaChanged) await saveMeta();
		if(id==="new"){
			await db.collection("items").add({...body,track:parentId?trackOf(items[parentId]):tr,status:"todo",order:nextOrder(parentId,tr)});
		}else{
			const cur=items[id];
			if((cur.parentId||null)!==parentId) body.order=nextOrder(parentId,trackOf(cur));
			if(parentId) body.track=trackOf(items[parentId]);
			await db.doc("items/"+id).update(body);
		}
	},id==="new"?"Added.":"Saved.");
	if(ok){editing=null;if(parentId)expanded.add(parentId);saveUI();}
	render();
});

/* ---------- boot ---------- */
render();
(async()=>{
	const c=window.claude;
	db=c&&c.use?await c.use("db"):null;
	if(!db){setStatus("Open this board on claude.ai to load its tasks.",true);canWrite=false;render();return;}
	try{const u=await c.use("user");if(u){const w=await u.can("data.write");if(w===false)canWrite=false;}}catch(_){}
	const onErr=()=>setStatus("The board stopped updating. Reload the page to reconnect.",true);
	const later=()=>{if(editing||renaming){pendingRender=true;return;}render();};
	db.doc("meta/lists").onSnapshot(s=>{if(s.exists){const d=s.data();meta={groups:{business:[...(d.groups?.business||[])],website:[...(d.groups?.website||[])]},people:[...(d.people||[])]};}later();},onErr);
	db.collection("items").onSnapshot(s=>{items={};s.docs.forEach(d=>items[d.id]={id:d.id,...d.data()});setStatus(s.size?"":"No tasks yet.");later();},onErr);
})();
</script>
